<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>INVESTMENT PRO</h1>
  <div id="clock"></div>
</header>

<section class="balance">

  <div class="card">
    <h2>Deposited</h2>
    <p>$5,000</p>
  </div>

  <div class="card">
    <h2>Profit Earned</h2>
    <p>$1,250</p>
  </div>

  <div class="card">
    <h2>Withdraw</h2>
    <button>Withdraw Now</button>
  </div>

</section>

<section class="leaderboard">

<h2>Top Investors</h2>

<div class="investor gold">
  🥇 Alex — $20,000 Bonus
</div>

<div class="investor silver">
  🥈 Sarah — $15,000 Bonus
</div>

<div class="investor bronze">
  🥉 Mike — $10,000 Bonus
</div>

</section>

<script src="script.js"></script>

</body>
</html>
